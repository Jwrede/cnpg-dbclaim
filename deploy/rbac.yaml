apiVersion: v1
kind: Namespace
metadata:
  name: cnpg-dbclaim
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cnpg-dbclaim
  namespace: cnpg-dbclaim
---
# The controller needs these permissions in every namespace that holds
# claims (secrets) and in every namespace that holds a shared Cluster
# (secrets, CNPG Database/DatabaseRole). To keep the CNPG part narrower,
# run with -cluster-namespaces and move the postgresql.cnpg.io and secrets
# rules into Roles in those namespaces (see README).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cnpg-dbclaim
rules:
  - apiGroups: [dbclaim.jonathanwrede.de]
    resources: [databaseclaims]
    verbs: [get, list, watch, update, patch]
  - apiGroups: [dbclaim.jonathanwrede.de]
    resources: [databaseclaims/status]
    verbs: [get, update, patch]
  - apiGroups: [dbclaim.jonathanwrede.de]
    resources: [databasegrants]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [namespaces]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, list, watch, create, update, delete]
  - apiGroups: [postgresql.cnpg.io]
    resources: [clusters]
    verbs: [get, list, watch]
  - apiGroups: [postgresql.cnpg.io]
    resources: [databases, databaseroles]
    verbs: [get, list, watch, create, update, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cnpg-dbclaim
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cnpg-dbclaim
subjects:
  - kind: ServiceAccount
    name: cnpg-dbclaim
    namespace: cnpg-dbclaim
---
# Lets namespace admins and editors manage claims (aggregated into the
# built-in admin and edit roles). Grants are meant for whoever owns the
# Cluster's namespace and are not aggregated.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cnpg-dbclaim-claims-edit
  labels:
    rbac.authorization.k8s.io/aggregate-to-admin: "true"
    rbac.authorization.k8s.io/aggregate-to-edit: "true"
rules:
  - apiGroups: [dbclaim.jonathanwrede.de]
    resources: [databaseclaims]
    verbs: [get, list, watch, create, update, patch, delete]
