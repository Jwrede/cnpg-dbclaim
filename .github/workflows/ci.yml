name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "41 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go test -race ./...
      - run: go build ./cmd/cnpg-dbclaim

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        cnpg: ["1.30.2", "1.30.1"]
    steps:
      - uses: actions/checkout@v7
      - name: Install kind
        run: |
          curl -fsSLo kind https://kind.sigs.k8s.io/dl/v0.30.0/kind-linux-amd64
          sudo install kind /usr/local/bin/kind
          kind version
          kubectl version --client
      - run: e2e/run.sh
        env:
          CNPG_VERSION: ${{ matrix.cnpg }}
      - name: Diagnostics
        if: failure()
        run: |
          kubectl get pods -A || true
          kubectl get databaseclaims,databasegrants -A -o wide || true
          kubectl -n db get databases.postgresql.cnpg.io,databaseroles.postgresql.cnpg.io -o yaml || true
          kubectl -n cnpg-dbclaim logs deployment/cnpg-dbclaim --tail=300 || true
          kubectl -n cnpg-system logs deployment/cnpg-controller-manager --tail=200 || true
          kubectl -n db logs shared-1 -c postgres --tail=200 || true
